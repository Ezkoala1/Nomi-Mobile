name: Build Nomi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract mobile app
        run: |
          unzip -q nomi-mobile-app.zip -d extracted

          PROJECT=$(find extracted -name package.json -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Could not find package.json"
            exit 1
          fi

          echo "Found project at: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        run: npm install

      - name: Fix Expo-compatible dependencies
        working-directory: ${{ env.PROJECT }}
        run: |
          npx expo install react-native-screens

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Create Expo project
        working-directory: ${{ env.PROJECT }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas init --force --non-interactive

      - name: Create environment file
        working-directory: ${{ env.PROJECT }}
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_SUPABASE_URL=$SUPABASE_URL
          EXPO_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_KEY
          EOF

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive

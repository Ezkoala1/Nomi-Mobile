name: Build Nomi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q nomi-mobile-app.zip -d extracted
          echo "ZIP contents:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Expo project
        run: |
          PROJECT=$(find extracted -name package.json -type f -print -quit | xargs dirname)
          echo "Found project at: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas init --non-interactive
          eas build --platform android --profile preview --non-interactive
